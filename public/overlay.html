<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EyeCare 休息提醒</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;color:#f8fafc;font-family:system-ui,"Segoe UI",sans-serif;background:transparent}body{display:grid;place-items:stretch}main{width:100%;height:100%;padding:20px 22px;background:linear-gradient(145deg,rgba(10,31,36,.98),rgba(5,16,23,.98));border:1px solid rgba(94,234,212,.28);border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.06)}.header{display:flex;align-items:center;gap:9px;color:#6ee7b7;font-size:11px;font-weight:700;letter-spacing:.04em}.header svg{width:22px;height:22px;flex:none}.eyebrow{margin-left:auto;color:#78969b;font-size:9px;font-weight:500;letter-spacing:0}.title{margin:15px 0 5px;color:#f0fffb;font-size:20px;font-weight:750}.description{margin:0;color:#a6b4bc;font-size:11px;line-height:1.5}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:20px;flex-wrap:wrap}button{padding:8px 12px;border-radius:8px;color:#d9ece9;background:#152d34;border:1px solid #31505a;cursor:pointer;font-size:11px}button.primary{color:#042019;background:linear-gradient(105deg,#34d399,#14b8a6);border-color:#5eead4;font-weight:700}button:focus-visible{outline:2px solid #6ee7b7;outline-offset:3px}button:disabled{cursor:wait;opacity:.55}#overlayStatus{min-height:14px;margin:8px 0 0;color:#8bd4c0;font-size:10px;text-align:right}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main role="dialog" aria-modal="false" aria-labelledby="overlayTitle" aria-describedby="overlayDescription"><div class="header"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 12s3.6-6 9.5-6 9.5 6 9.5 6-3.6 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg><span>EYE RESET / 护眼提醒</span><span class="eyebrow">至少休息 1 分钟</span></div><h1 class="title" id="overlayTitle">该让眼睛休息一下了</h1><p class="description" id="overlayDescription">看向 6 米外的远方，至少放松 1 分钟；完成后请手动确认。</p><div class="actions"><button id="snooze">延后 5 分钟</button><button id="skip">跳过</button><button id="done" class="primary">完成休息</button></div><p id="overlayStatus" role="status" aria-live="polite"></p></main><script src="/overlay.js"></script></body></html>
