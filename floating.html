<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07131a" />
    <title>EyeCare 悬浮倒计时</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { display: grid; place-items: center end; color: #e8f4f1; }
      button { font: inherit; }
      .floating { position: relative; width: 72px; height: 72px; display: grid; place-items: center; border: 1px solid rgba(94, 234, 212, .24); border-radius: 50%; background: radial-gradient(circle at 35% 25%, rgba(20, 184, 166, .34), rgba(5, 18, 24, .96) 70%); box-shadow: 0 9px 28px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .09), 0 0 22px rgba(16, 185, 129, .16); cursor: pointer; user-select: none; -webkit-app-region: no-drag; transition: transform .2s ease, box-shadow .2s ease; }
      .floating:hover { transform: translateY(-1px) scale(1.03); box-shadow: 0 12px 30px rgba(0, 0, 0, .48), inset 0 1px 0 rgba(255, 255, 255, .1), 0 0 28px rgba(16, 185, 129, .26); }
      .floating:focus-visible { outline: 2px solid #6ee7b7; outline-offset: 3px; }
      .ring { position: absolute; inset: 4px; width: 64px; height: 64px; transform: rotate(-90deg); pointer-events: none; }
      .ring-track, .ring-progress { fill: none; stroke-width: 3.5; }
      .ring-track { stroke: rgba(148, 163, 184, .18); }
      .ring-progress { stroke: url(#floating-gradient); stroke-linecap: round; stroke-dasharray: 182.21; stroke-dashoffset: 0; transition: stroke-dashoffset .35s linear, stroke .2s ease; }
      .floating.paused .ring-progress { stroke: #fbbf24; }
      .time { position: relative; z-index: 1; margin-top: 1px; color: #f3fffc; font: 800 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: -.06em; text-shadow: 0 2px 10px rgba(0, 0, 0, .45); }
      .status { position: absolute; top: 2px; right: 5px; width: 7px; height: 7px; border: 1px solid #062019; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 2px rgba(52, 211, 153, .14), 0 0 10px rgba(52, 211, 153, .65); }
      .state-text { position: absolute; bottom: 10px; left: 0; right: 0; color: #8bd4c0; font-size: 7px; font-weight: 700; letter-spacing: .04em; text-align: center; }
      .floating.paused .status { background: #fbbf24; box-shadow: 0 0 0 2px rgba(251, 191, 36, .14), 0 0 10px rgba(251, 191, 36, .5); }
      .floating.paused .state-text { color: #fcd34d; }
      .drag-region { position: absolute; right: 7px; bottom: 7px; z-index: 3; width: 17px; height: 17px; border: 1px solid rgba(148, 163, 184, .25); border-radius: 50%; color: #9fb6b6; background: rgba(3, 13, 18, .78); cursor: move; -webkit-app-region: no-drag; }
      .drag-region::before { content: ""; position: absolute; inset: 5px; background: radial-gradient(circle, currentColor 1px, transparent 1.5px) 0 0 / 4px 4px; opacity: .8; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      @media (max-width: 80px), (max-height: 80px) { .time { font-size: 12px; } .drag-region { right: 5px; bottom: 5px; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main id="floating" class="floating" role="button" tabindex="0" aria-label="护眼倒计时，点击恢复主窗口">
      <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="floating-gradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34d399" /><stop offset=".55" stop-color="#14b8a6" /><stop offset="1" stop-color="#38bdf8" /></linearGradient></defs>
        <circle class="ring-track" cx="32" cy="32" r="29" />
        <circle id="progress" class="ring-progress" cx="32" cy="32" r="29" />
      </svg>
      <span id="time" class="time" role="timer" aria-live="off">20:00</span>
      <span id="status" class="status" aria-hidden="true"></span>
      <button id="dragRegion" class="drag-region" type="button" title="拖动悬浮窗" aria-label="拖动悬浮窗"></button>
      <span id="stateLabel" class="state-text">专注中</span>
    </main>
    <script type="module" src="/src/floating.ts"></script>
  </body>
</html>
